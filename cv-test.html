<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabor Grove CV test</title>
<style>
:root{color-scheme:dark;--bg:#0b141d;--fg:#f1e3c4;--dim:rgba(241,227,196,.6);--line:rgba(241,227,196,.18);--glow:#74f0d2}
body{margin:0;padding:20px 16px 40px;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;max-width:720px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--dim);margin:0 0 14px;max-width:60ch}
button{font:inherit;color:#06201b;background:var(--glow);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.grid{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 12px;align-items:center;margin:16px 0}
.grid input[type=range]{width:100%;accent-color:var(--glow)}label{white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--glow);width:0}
h2{font-size:13px;font-weight:600;color:var(--dim);margin:22px 0 0;text-transform:none}
</style>
</head>
<body>
<h1>Gabor Grove CV test</h1>
<p>A stand-in for a mod matrix. It opens Gabor Grove in another window, plays its parameters over postMessage, and reads its motion back. The same messages work from any site.</p>
<button id="open" type="button">Open Gabor Grove</button>
<button id="sound" type="button">Sound: off</button>
<h2>Send (set a value, or tick LFO to modulate around it)</h2>
<div class="grid" id="ins"></div>
<h2>Receive</h2>
<div class="grid" id="outs" style="grid-template-columns:auto 1fr"></div>
<script>
let gg=null,ins=[],t0=performance.now(),ctx=null,osc=null,gain=null,pan=null;
const $=id=>document.getElementById(id);
$('open').onclick=()=>{gg=window.open('./index.html?cv','gabor-grove');};
addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d.type!=='string')return;
  if(d.type==='gg:ready'&&e.source){gg=e.source;gg.postMessage({type:'gg:describe'},'*');}
  if(d.type==='gg:params'&&!ins.length)build(d);
  if(d.type==='gg:state')show(d.values);
});
function build(d){
  ins=d.inputs;
  $('ins').innerHTML=ins.map((p,i)=>`<label for="s${i}">${p.label}</label><input type="range" id="s${i}" min="0" max="1" step="0.001" value="${p.value}"><label><input type="checkbox" id="l${i}"> LFO</label><input type="range" id="r${i}" min="0.02" max="2" step="0.01" value="${(0.1+0.07*i).toFixed(2)}" style="width:90px" aria-label="LFO rate in hertz">`).join('');
  ins.forEach((p,i)=>{$('s'+i).oninput=e=>gg&&gg.postMessage({type:'gg:set',param:p.name,value:+e.target.value},'*');
    $('l'+i).onchange=e=>{if(!e.target.checked&&gg)gg.postMessage({type:'gg:mod',param:p.name,value:0},'*');};});
  $('outs').innerHTML=d.outputs.map(n=>`<span>${n}</span><div class="bar"><i id="o_${n}"></i></div>`).join('');
}
function show(v){
  for(const k in v){const el=$('o_'+k);if(el)el.style.width=(v[k]*100).toFixed(1)+'%';}
  if(osc){const t=ctx.currentTime;osc.frequency.setTargetAtTime(110*Math.pow(2,v.spatialFreq*3),t,0.05);gain.gain.setTargetAtTime(0.25*v.contrast*(1-0.8*v.pullApart),t,0.05);pan.pan.setTargetAtTime(v.angleSin*2-1,t,0.05);}
}
// the other direction: Gabor Grove's spatial frequency sets pitch, contrast sets level, carrier angle pans
$('sound').onclick=()=>{
  if(osc){osc.stop();osc=null;ctx.close();$('sound').textContent='Sound: off';return;}
  ctx=new AudioContext();osc=ctx.createOscillator();gain=ctx.createGain();pan=ctx.createStereoPanner();
  osc.type='triangle';gain.gain.value=0;osc.connect(gain).connect(pan).connect(ctx.destination);osc.start();$('sound').textContent='Sound: on';
};
setInterval(()=>{
  if(!gg)return;const t=(performance.now()-t0)/1000;
  ins.forEach((p,i)=>{if($('l'+i)&&$('l'+i).checked)gg.postMessage({type:'gg:mod',param:p.name,value:0.35*Math.sin(2*Math.PI*+$('r'+i).value*t)},'*');});
},33);
</script>
</body>
</html>
